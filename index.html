<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalorie">
  <title>Kalorie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab" data-action="tab" data-view="today">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" /><path d="M12 7v5l3 2" /></svg>
      <span>Dziś</span>
    </button>
    <button class="tab" data-action="tab" data-view="history">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9" /></svg>
      <span>Historia</span>
    </button>
    <button class="tab" data-action="tab" data-view="ideas">
      <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z" /><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5" /></svg>
      <span>Inspiracje</span>
    </button>
    <button class="tab" data-action="tab" data-view="products">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
      <span>Produkty</span>
    </button>
    <button class="tab" data-action="tab" data-view="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="sheet" hidden>
    <div class="overlay" data-action="sheet-close"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <button class="link left" id="sheet-back" data-action="sheet-back">‹ Wstecz</button>
        <h2 id="sheet-title"></h2>
        <button class="link right" data-action="sheet-close">Zamknij</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="products.js"></script>
  <script src="health.js"></script>
  <script src="portions.js"></script>
  <script src="recipes-db.js"></script>
  <script src="app.js"></script>
</body>
</html>
